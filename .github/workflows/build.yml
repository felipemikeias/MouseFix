name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  # Release build: 32-bit MinGW against msvcrt.dll, runs on Windows XP and later.
  mingw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686-win32 binutils-mingw-w64-i686

      - name: Test filter
        run: |
          cc -std=c99 -Wall -Wextra -pedantic -Werror -Isrc src/debounce.c tests/test_debounce.c -o test_debounce
          ./test_debounce

      - name: Build
        run: |
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-i686.cmake -DCMAKE_BUILD_TYPE=Release -DMOUSEFIX_TESTS=OFF
          cmake --build build

      - name: Check Windows XP compatibility
        run: |
          headers=$(i686-w64-mingw32-objdump -p build/MouseFix.exe)
          echo "$headers" | grep -E "MajorOSystemVersion\s+5$"
          echo "$headers" | grep -E "MajorSubsystemVersion\s+5$"
          dlls=$(echo "$headers" | awk '/DLL Name:/ {print toupper($3)}' | sort -u | tr '\n' ' ')
          echo "Imported DLLs: $dlls"
          [ "$dlls" = "ADVAPI32.DLL KERNEL32.DLL MSVCRT.DLL SHELL32.DLL USER32.DLL " ]

      - uses: actions/upload-artifact@v7
        with:
          name: MouseFix
          path: build/MouseFix.exe

  # Keeps the Visual Studio build working.
  msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: |
          cmake -B build -A x64
          cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mingw, msvc]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: MouseFix

      - name: Prepare notes
        run: |
          cp .github/release-notes.md notes.md
          printf '\n<sub>SHA-256 (MouseFix.exe): `%s`</sub>\n' \
            "$(sha256sum MouseFix.exe | cut -d' ' -f1)" >> notes.md

      - uses: softprops/action-gh-release@v3
        with:
          name: MouseFix ${{ github.ref_name }}
          files: MouseFix.exe
          body_path: notes.md
